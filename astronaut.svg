<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020111"/>
      <stop offset="100%" stop-color="#201a33"/>
    </linearGradient>

    <!-- Moon surface -->
    <radialGradient id="moon" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#9e9e9e"/>
      <stop offset="100%" stop-color="#424242"/>
    </radialGradient>

    <!-- Stars -->
    <g id="star">
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Flag -->
    <g id="flag">
      <rect x="0" y="-80" width="4" height="80" rx="2" fill="#cccccc"/>
      <path class="flag-cloth" d="M 4 -78 Q 20 -85 40 -70 Q 20 -55 4 -62 Z" fill="#ff4444"/>
    </g>

    <!-- Astronaut -->
    <g id="astronaut">
      <rect x="-18" y="-45" width="12" height="35" rx="4" fill="#a0a0a0"/>
      <rect x="-12" y="-40" width="24" height="35" rx="10" fill="#ffffff"/>
      <line x1="-12" y1="-25" x2="12" y2="-25" stroke="#dddddd" stroke-width="2"/>
      <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#dddddd" stroke-width="2"/>
      <rect x="-15" y="-60" width="30" height="28" rx="14" fill="#ffffff"/>
      <rect x="-10" y="-55" width="24" height="15" rx="6" fill="#1a1a1a"/>
      <path d="M -5 -50 Q 0 -53 10 -50" stroke="#444444" stroke-width="2" fill="none" stroke-linecap="round"/>
      
      <g class="leg-l"><rect x="-10" y="-10" width="8" height="20" rx="4" fill="#ffffff"/></g>
      <g class="leg-r"><rect x="2" y="-10" width="8" height="20" rx="4" fill="#ffffff"/></g>
      <g class="arm-l"><rect x="-12" y="-40" width="7" height="22" rx="3.5" fill="#ffffff"/></g>
      <g class="carried-flag"><use href="#flag" x="12" y="-15" transform="rotate(20)"/></g>
      <g class="arm-r"><rect x="5" y="-40" width="7" height="22" rx="3.5" fill="#ffffff"/></g>
    </g>
  </defs>

  <style>
    @keyframes starPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .s1 { animation: starPulse 2s infinite ease-in-out; }
    .s2 { animation: starPulse 3s infinite ease-in-out 1s; }
    .s3 { animation: starPulse 2.5s infinite ease-in-out 0.5s; }
    .s4 { animation: starPulse 4s infinite ease-in-out 2s; }

    @keyframes walkAcross {
      0%   { transform: translate(-80px, 240px); }
      30%  { transform: translate(360px, 240px); }
      40%  { transform: translate(360px, 240px); }
      100% { transform: translate(900px, 240px); }
    }

    @keyframes legSwingL {
      0%, 100% { transform: rotate(25deg); }
      50%      { transform: rotate(-25deg); }
    }
    @keyframes legSwingR {
      0%, 100% { transform: rotate(-25deg); }
      50%      { transform: rotate(25deg); }
    }
    @keyframes armSwingL {
      0%, 100% { transform: rotate(-25deg); }
      50%      { transform: rotate(25deg); }
    }

    @keyframes armR_Anim {
      0%, 28%  { transform: rotate(-40deg); }
      29%, 38% { transform: rotate(-10deg); }
      39%, 49%, 59%, 69%, 79%, 89%, 99% { transform: rotate(25deg); }
      44%, 54%, 64%, 74%, 84%, 94% { transform: rotate(-25deg); }
      100% { transform: rotate(25deg); }
    }

    @keyframes carriedFlagAnim {
      0%, 30% { opacity: 1; }
      31%, 100% { opacity: 0; }
    }
    
    @keyframes plantedFlagAnim {
      0%, 30% { opacity: 0; }
      31%, 100% { opacity: 1; }
    }

    @keyframes flagClothWave {
      0%, 100% { d: path('M 4 -78 Q 20 -85 40 -70 Q 20 -55 4 -62 Z'); }
      50% { d: path('M 4 -78 Q 20 -60 40 -70 Q 20 -80 4 -62 Z'); }
    }

    .astronaut-group {
      animation: walkAcross 15s linear infinite;
    }
    .astronaut-group .leg-l {
      animation: legSwingL 0.6s infinite alternate ease-in-out;
      transform-origin: 50% 0%;
    }
    .astronaut-group .leg-r {
      animation: legSwingR 0.6s infinite alternate ease-in-out;
      transform-origin: 50% 0%;
    }
    .astronaut-group .arm-l {
      animation: armSwingL 0.6s infinite alternate ease-in-out;
      transform-origin: 50% 0%;
    }
    .astronaut-group .arm-r {
      animation: armR_Anim 15s linear infinite;
      transform-origin: 50% 0%;
    }
    .astronaut-group .carried-flag {
      animation: carriedFlagAnim 15s step-end infinite;
    }
    .planted-flag {
      animation: plantedFlagAnim 15s step-end infinite;
    }
    .flag-cloth {
      animation: flagClothWave 1.2s infinite ease-in-out;
    }
  </style>

  <rect width="800" height="300" fill="url(#space)"/>

  <!-- Twinkling Stars -->
  <use href="#star" x="100" y="50" class="s1"/>
  <use href="#star" x="250" y="100" class="s2"/>
  <use href="#star" x="400" y="30" class="s3"/>
  <use href="#star" x="550" y="120" class="s4"/>
  <use href="#star" x="700" y="60" class="s1"/>
  <use href="#star" x="60" y="180" class="s2"/>
  <use href="#star" x="300" y="160" class="s3"/>
  <use href="#star" x="650" y="150" class="s4"/>
  <use href="#star" x="480" y="80" class="s1"/>

  <!-- Earth -->
  <circle cx="680" cy="70" r="35" fill="#3282b8"/>
  <path d="M 660 50 Q 670 40 690 60 Q 700 70 680 90 Q 670 90 660 70 Z" fill="#bce6eb"/>
  <circle cx="680" cy="70" r="35" fill="#ffffff" opacity="0.1"/>

  <!-- Moon Base & Craters -->
  <ellipse cx="400" cy="500" rx="800" ry="280" fill="url(#moon)"/>
  <ellipse cx="150" cy="240" rx="40" ry="8" fill="#555555" opacity="0.4"/>
  <ellipse cx="550" cy="260" rx="60" ry="12" fill="#555555" opacity="0.3"/>
  <ellipse cx="750" cy="230" rx="30" ry="6" fill="#555555" opacity="0.5"/>
  <ellipse cx="300" cy="280" rx="70" ry="15" fill="#555555" opacity="0.2"/>

  <!-- Planted Flag -->
  <use href="#flag" x="390" y="235" class="planted-flag"/>

  <!-- Astronaut walking animation -->
  <g class="astronaut-group">
    <use href="#astronaut"/>
  </g>
</svg>
