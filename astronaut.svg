<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <!-- Star: 4-point star -->
    <g id="star">
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="white"/>
    </g>
    <!-- Simple dot star -->
    <g id="dot-star">
      <circle cx="0" cy="0" r="1.5" fill="white"/>
    </g>

    <!-- Flag -->
    <g id="flag">
      <line x1="0" y1="-80" x2="0" y2="0" stroke="white" stroke-width="2"/>
      <path class="flag-cloth" d="M 0 -78 Q 20 -85 40 -70 Q 20 -55 0 -62 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- Astronaut (Black and White Line Art Style) -->
    <g id="astronaut">
      <g stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Floating space hose/cord -->
        <path d="M -16 -40 Q -35 -30 -35 -10 Q -35 15 -20 20 Q -10 25 -15 0" fill="none"/>

        <!-- Backpack -->
        <rect x="-24" y="-45" width="14" height="35" rx="3" fill="black"/>
        <rect x="-21" y="-40" width="8" height="8" rx="2" fill="black"/>
        <rect x="-21" y="-25" width="8" height="8" rx="2" fill="black"/>

        <!-- Back arm (Left Arm) -->
        <g class="arm-l">
          <rect x="-10" y="-35" width="8" height="22" rx="4" fill="black"/>
          <!-- Arm rings -->
          <line x1="-10" y1="-22" x2="-2" y2="-22"/>
          <line x1="-10" y1="-18" x2="-2" y2="-18"/>
        </g>
        
        <!-- Back leg (Left Leg) -->
        <g class="leg-l">
          <rect x="-10" y="-10" width="10" height="20" rx="4" fill="black"/>
          <path d="M -12 6 L -2 6"/>
        </g>

        <!-- Body -->
        <rect x="-16" y="-35" width="28" height="32" rx="10" fill="black"/>
        <path d="M -16 -20 L 12 -20" fill="none"/>
        <path d="M -16 -12 L 12 -12" fill="none"/>
        <path d="M -2 -20 L -2 -35" fill="none"/>

        <!-- Helmet (Large and round) -->
        <circle cx="-2" cy="-60" r="26" fill="black"/>
        
        <!-- Helmet visor reflection line -->
        <path d="M 5 -80 Q 20 -60 15 -42 Q 10 -55 5 -80 Z" fill="none"/>
        <ellipse cx="17" cy="-35" rx="1.5" ry="3" fill="white" stroke="none" transform="rotate(-30, 17, -35)"/>

        <!-- Front leg (Right Leg) -->
        <g class="leg-r">
          <rect x="2" y="-10" width="10" height="20" rx="4" fill="black"/>
          <path d="M 0 6 L 10 6"/>
        </g>
      </g>
      
      <!-- Carried Flag -->
      <g class="carried-flag">
        <use href="#flag" x="12" y="-15" transform="rotate(20)"/>
      </g>

      <!-- Front arm (Right Arm - Drawn above the flag) -->
      <g class="arm-r" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="-35" width="8" height="22" rx="4" fill="black"/>
        <line x1="6" y1="-22" x2="14" y2="-22"/>
        <line x1="6" y1="-18" x2="14" y2="-18"/>
      </g>
    </g>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes starPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .s1 { animation: starPulse 2.5s infinite ease-in-out; }
    .s2 { animation: starPulse 3.5s infinite ease-in-out 1s; }
    .s3 { animation: starPulse 3s infinite ease-in-out 0.5s; }
    .s4 { animation: starPulse 4.5s infinite ease-in-out 2s; }

    @keyframes walkAcross {
      0%   { transform: translate(-80px, 240px); }
      30%  { transform: translate(360px, 240px); }
      40%  { transform: translate(360px, 240px); }
      100% { transform: translate(900px, 240px); }
    }

    @keyframes legSwingL {
      0%, 100% { transform: rotate(25deg); }
      50%      { transform: rotate(-25deg); }
    }
    @keyframes legSwingR {
      0%, 100% { transform: rotate(-25deg); }
      50%      { transform: rotate(25deg); }
    }
    @keyframes armSwingL {
      0%, 100% { transform: rotate(-25deg); }
      50%      { transform: rotate(25deg); }
    }

    @keyframes armR_Anim {
      0%, 28%  { transform: rotate(-40deg); }
      29%, 38% { transform: rotate(-10deg); }
      39%, 49%, 59%, 69%, 79%, 89%, 99% { transform: rotate(25deg); }
      44%, 54%, 64%, 74%, 84%, 94% { transform: rotate(-25deg); }
      100% { transform: rotate(25deg); }
    }

    @keyframes carriedFlagAnim {
      0%, 30% { opacity: 1; }
      31%, 100% { opacity: 0; }
    }
    
    @keyframes plantedFlagAnim {
      0%, 30% { opacity: 0; }
      31%, 100% { opacity: 1; }
    }

    @keyframes flagClothWave {
      0%, 100% { d: path('M 0 -78 Q 20 -85 40 -70 Q 20 -55 0 -62 Z'); }
      50% { d: path('M 0 -78 Q 20 -60 40 -70 Q 20 -80 0 -62 Z'); }
    }

    .astronaut-group {
      animation: walkAcross 15s linear infinite;
    }
    .astronaut-group .leg-l {
      animation: legSwingL 0.6s infinite alternate ease-in-out;
      transform-origin: 50% 0%;
    }
    .astronaut-group .leg-r {
      animation: legSwingR 0.6s infinite alternate ease-in-out;
      transform-origin: 50% 0%;
    }
    .astronaut-group .arm-l {
      animation: armSwingL 0.6s infinite alternate ease-in-out;
      transform-origin: 50% 0%;
    }
    .astronaut-group .arm-r {
      animation: armR_Anim 15s linear infinite;
      transform-origin: 50% 0%;
    }
    .astronaut-group .carried-flag {
      animation: carriedFlagAnim 15s step-end infinite;
    }
    .planted-flag {
      animation: plantedFlagAnim 15s step-end infinite;
    }
    .flag-cloth {
      animation: flagClothWave 1.2s infinite ease-in-out;
    }
  </style>

  <!-- Deep Space Background -->
  <rect width="800" height="300" fill="black"/>

  <!-- Celestial Bodies (Stars) -->
  <use href="#star" x="120" y="60" class="s1"/>
  <use href="#dot-star" x="80" y="30" class="s2"/>
  <use href="#star" x="280" y="110" class="s2"/>
  <use href="#dot-star" x="200" y="150" class="s3"/>
  <use href="#star" x="420" y="40" class="s3"/>
  <use href="#dot-star" x="480" y="140" class="s1"/>
  <use href="#star" x="650" y="130" class="s4"/>
  <use href="#dot-star" x="720" y="50" class="s2"/>
  <use href="#dot-star" x="350" y="180" class="s4"/>
  <use href="#star" x="550" y="80" class="s1"/>
  <use href="#dot-star" x="40" y="200" class="s3"/>
  <use href="#star" x="20" y="120" class="s4"/>

  <!-- Ringed Planet -->
  <g transform="translate(180, 80) scale(0.9) rotate(-20)" stroke="white" stroke-width="2" fill="black">
    <!-- Back of ring -->
    <path d="M -35 0 A 35 10 0 0 1 35 0" fill="none"/>
    <!-- Planet body -->
    <circle cx="0" cy="0" r="18"/>
    <!-- Front of ring -->
    <path d="M -35 0 A 35 10 0 0 0 35 0" fill="none"/>
    <!-- Stray floating bit -->
    <circle cx="-50" cy="20" r="3" fill="none"/>
  </g>

  <!-- Distant Textured Planet -->
  <g transform="translate(680, 110)" stroke="white" stroke-width="2" fill="black">
    <circle cx="0" cy="0" r="22"/>
    <path d="M -12 -12 Q -2 -18 8 -8 Q 12 2 4 12" fill="none"/>
    <path d="M -18 10 Q -10 2 -2 10" fill="none"/>
  </g>

  <!-- Galaxy swirl -->
  <g transform="translate(620, 45) rotate(-15) scale(0.6)" stroke="white" stroke-width="2" fill="none">
    <ellipse cx="0" cy="0" rx="45" ry="15"/>
    <ellipse cx="0" cy="0" rx="65" ry="22"/>
    <circle cx="0" cy="0" r="4" fill="white"/>
    <use href="#star" x="-30" y="-10"/>
    <use href="#dot-star" x="42" y="15"/>
    <use href="#dot-star" x="-50" y="15"/>
  </g>

  <!-- Moon Surface Background Layer/Horizon -->
  <ellipse cx="400" cy="500" rx="800" ry="260" fill="black" stroke="white" stroke-width="2"/>

  <!-- Stylized Craters -->
  <g fill="black" stroke="white" stroke-width="2">
    <ellipse cx="180" cy="260" rx="35" ry="8"/>
    <path d="M 155 261 Q 180 266 205 261" fill="none"/>

    <ellipse cx="620" cy="270" rx="45" ry="10"/>
    <path d="M 590 272 Q 620 278 650 272" fill="none"/>

    <ellipse cx="400" cy="245" rx="25" ry="6"/>
    <path d="M 382 246 Q 400 250 418 246" fill="none"/>
  </g>

  <!-- Planted Flag -->
  <use href="#flag" x="390" y="235" class="planted-flag"/>

  <!-- Animated Astronaut -->
  <g class="astronaut-group">
    <use href="#astronaut"/>
  </g>
</svg>
